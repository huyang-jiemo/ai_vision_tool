name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest          # 默认 arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime + build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt
      - name: Export YOLO11n -> ONNX
        run: python models/download_models.py
      - name: PyInstaller
        run: pyinstaller build.spec --noconfirm
      - name: Package .app
        run: ditto -c -k --sequesterRsrc dist/AIVisionTool.app AIVisionTool-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-arm64
          path: AIVisionTool-macOS-arm64.zip
          retention-days: 7   # 自动过期，避免长期占用账号 500MB 制品配额

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime + build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt
      - name: Export YOLO11n -> ONNX
        run: python models/download_models.py
      - name: PyInstaller
        run: pyinstaller build.spec --noconfirm
      # 无网交付：随包分发 WebView2 离线安装器（Evergreen Standalone x64），
      # 缺少 WebView2 的机器（精简版/内网机）打开会白屏，装上即可运行
      - name: Bundle WebView2 offline installer
        run: |
          New-Item -ItemType Directory -Path dist/AIVisionTool/webview2-runtime -Force | Out-Null
          curl.exe -L --fail --retry 3 -o dist/AIVisionTool/webview2-runtime/MicrosoftEdgeWebView2RuntimeInstallerX64.exe "https://go.microsoft.com/fwlink/?linkid=2091953"
          $f = Get-Item dist/AIVisionTool/webview2-runtime/MicrosoftEdgeWebView2RuntimeInstallerX64.exe
          if ($f.Length -lt 50MB) { throw "WebView2 installer 下载不完整（$($f.Length) 字节）" }
          Write-Host "WebView2 installer: $($f.Length / 1MB -as [int]) MB"
      - name: Package .exe
        run: Compress-Archive -Path dist/AIVisionTool -DestinationPath AIVisionTool-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64
          path: AIVisionTool-Windows-x64.zip
          retention-days: 7   # 自动过期，避免长期占用账号 500MB 制品配额

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 默认 GITHUB_TOKEN 只读，创建 Release 需要写权限
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            AIVisionTool-macOS-arm64.zip
            AIVisionTool-Windows-x64.zip
