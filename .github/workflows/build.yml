name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest          # 默认 arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime + build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt
      - name: Export YOLO11n -> ONNX
        run: python models/download_models.py
      - name: Run regression self-tests
        run: |
          python tools/selftest_dom_crs.py
          python tools/selftest_vehicle_crs.py
          python tools/selftest_api_crs.py
          python tools/selftest_regressions.py
          python tools/selftest_launcher.py
      - name: PyInstaller
        run: pyinstaller build.spec --noconfirm
      - name: Smoke test onedir app
        run: |
          export LOCALAPPDATA="$RUNNER_TEMP/avt_selftest"
          rm -rf "$LOCALAPPDATA"
          dist/AIVisionTool/AIVisionTool --selftest=crs
          diag="$LOCALAPPDATA/AIVisionTool/坐标系诊断.txt"
          test -f "$diag"
          cat "$diag"
          grep -q 'stage=done' "$diag"
          # 合成 EPSG:3857 影像应走「局部 TM」工作系并完成往返转换
          grep -q 'working_reason=local_tm' "$diag"
          grep -q 'roundtrip=ok' "$diag"
          # 打包后的 GDB 导出（pyogrio/GDAL/PROJ）与前端资源必须真实可用
          grep -q 'gdb_export=ok' "$diag"
          grep -q 'web_assets=ok' "$diag"
      - name: Package .app
        run: ditto -c -k --sequesterRsrc dist/AIVisionTool.app AIVisionTool-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-arm64
          path: AIVisionTool-macOS-arm64.zip
          retention-days: 7   # 自动过期，避免长期占用账号 500MB 制品配额

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime + build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt
      - name: Export YOLO11n -> ONNX
        run: python models/download_models.py
      # Windows 也要跑纯 Python 自检：Windows 专有的路径/编码问题
      # （如 cp1252 控制台、路径分隔符）只有在这里才会暴露。
      - name: Run CRS self-tests
        run: |
          python tools/selftest_dom_crs.py
          python tools/selftest_vehicle_crs.py
          python tools/selftest_api_crs.py
          python tools/selftest_regressions.py
          python tools/selftest_launcher.py
      - name: PyInstaller
        run: pyinstaller build.spec --noconfirm
      # 先单独验证 onedir 主程序本身能启动并完成自检（不含打包链路），
      # 自检模式不初始化 WebView2，因此可以放在运行时拷入之前。
      - name: Smoke test onedir app
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:LOCALAPPDATA 'AIVisionTool'
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          Start-Process -FilePath 'dist/AIVisionTool/AIVisionTool.exe' -ArgumentList '--selftest=crs'
          $diag = Join-Path $root '坐标系诊断.txt'
          # 诊断文件是分阶段写的（stage=start/pyproj/pipeline/done），
          # 只等文件出现会在第一步就误判失败，必须等 stage=done。
          # 首次运行 Windows Defender 会扫描 GDAL/PROJ 大体积 DLL，留足 4 分钟。
          $deadline = (Get-Date).AddMinutes(4)
          while ((Get-Date) -lt $deadline) {
            if ((Test-Path $diag) -and
                (Select-String -Path $diag -Pattern 'stage=done' -SimpleMatch -Quiet)) { break }
            Start-Sleep -Seconds 1
          }
          $done = (Test-Path $diag) -and
            (Select-String -Path $diag -Pattern 'stage=done' -SimpleMatch -Quiet)
          if (-not $done) {
            foreach ($f in '启动标记.txt', '自检错误.txt', '坐标系诊断.txt') {
              $p = Join-Path $root $f
              if (Test-Path $p) { Get-Content $p }
            }
            throw 'onedir 主程序自检未完成（见上方 stage/错误信息）'
          }
          Get-Content $diag
          $crsOk = (Select-String -Path $diag -Pattern 'working_reason=local_tm' -SimpleMatch -Quiet) -and
            (Select-String -Path $diag -Pattern 'roundtrip=ok' -SimpleMatch -Quiet) -and
            (Select-String -Path $diag -Pattern 'gdb_export=ok' -SimpleMatch -Quiet) -and
            (Select-String -Path $diag -Pattern 'web_assets=ok' -SimpleMatch -Quiet)
          if (-not $crsOk) { throw 'CRS 自检未覆盖工作系/往返/GDB 导出/前端资源' }
      # 无网交付：把 WebView2 固定版运行时（可再分发）直接打进包里，
      # 用户解压即可运行——零安装、零下载、无需管理员权限。
      # 构建期用官方独立安装器静默安装到 runner，再把运行时目录拷入包中。
      # 直链随版本变化且旧 fwlink 已失效（302 -> tbd），因此从微软官方
      # 自动维护的 winget 清单仓库解析最新版 x64 直链与 SHA256。
      - name: Bundle WebView2 runtime (fixed version, portable)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $H = @{ 'User-Agent' = 'ai-vision-tool-ci' }
          $vers = @(); $page = 1
          while ($page -le 30) {
            $r = Invoke-RestMethod "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/m/Microsoft/EdgeWebView2Runtime?per_page=100&page=$page" -Headers $H
            if (-not $r -or $r.Count -eq 0) { break }
            $vers += $r | ForEach-Object { $_.name }
            $page++
          }
          $latest = ($vers | Where-Object { $_ -match '^[\d.]+$' } |
            Sort-Object { [version]$_ } -Descending | Select-Object -First 1)
          if (-not $latest) { throw 'winget-pkgs 版本目录为空' }
          Write-Host "Latest WebView2 runtime: $latest"
          $yamlUrl = "https://raw.githubusercontent.com/microsoft/winget-pkgs/master/manifests/m/Microsoft/EdgeWebView2Runtime/$latest/Microsoft.EdgeWebView2Runtime.installer.yaml"
          $yaml = (Invoke-WebRequest $yamlUrl -Headers $H).Content
          $url = $null; $sha = $null; $want = $false
          foreach ($line in ($yaml -split "`r?`n")) {
            $s = $line.Trim()
            if ($s.EndsWith('Architecture: x64')) { $want = $true; $url = $null; $sha = $null; continue }
            if ($want -and (-not $url) -and $s.StartsWith('InstallerUrl:')) { $url = $s.Substring('InstallerUrl:'.Length).Trim() }
            if ($want -and $s.StartsWith('InstallerSha256:')) { $sha = $s.Substring('InstallerSha256:'.Length).Trim(); break }
          }
          if (-not $url) { throw '未解析到 x64 InstallerUrl' }
          Write-Host "InstallerUrl: $url"
          $exe = "$env:RUNNER_TEMP\MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
          curl.exe -L --fail --retry 3 -o $exe $url
          if ($sha) {
            $h = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
            if ($h -ne $sha.ToLower()) { throw "SHA256 校验失败：$h" }
          }
          # 静默安装到 runner（幂等；已装同/更新版本时安装器直接返回）
          Start-Process -FilePath $exe -ArgumentList '/silent', '/install' -Wait
          # 从系统安装目录拷出运行时（固定版等价物，微软允许随应用再分发）
          $appRoot = 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application'
          if (-not (Test-Path $appRoot)) { $appRoot = "$env:ProgramFiles\Microsoft\EdgeWebView\Application" }
          $verDir = Get-ChildItem $appRoot -Directory -ErrorAction Stop |
            Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not (Test-Path (Join-Path $verDir.FullName 'msedgewebview2.exe'))) {
            throw "运行时目录缺少 msedgewebview2.exe：$($verDir.FullName)"
          }
          Write-Host "Bundling runtime from: $($verDir.FullName)"
          New-Item -ItemType Directory -Path dist/AIVisionTool/webview2-runtime -Force | Out-Null
          Copy-Item "$($verDir.FullName)\*" 'dist/AIVisionTool/webview2-runtime/' -Recurse -Force
          Set-Content dist/AIVisionTool/webview2-runtime/VERSION "WebView2 Runtime $($verDir.Name) (fixed version, bundled)"
          $rt = Get-ChildItem dist/AIVisionTool/webview2-runtime -Recurse |
            Measure-Object -Property Length -Sum
          Write-Host "runtime files: $($rt.Count), $([int]($rt.Sum / 1MB)) MB"
      # 单文件交付：十几 MB 的 onefile 启动器 + 追加在末尾的 payload.zip。
      # 首次启动解压到 %LOCALAPPDATA%\AIVisionTool\app\<版本>-<摘要>，之后秒开；
      # 不产生需要解压一大堆文件的 zip，目标机也无需安装任何环境。
      - name: Build single-file exe
        run: |
          python tools/make_payload.py
          pyinstaller build_launcher.spec --noconfirm --distpath dist_single --workpath build_launcher
          python tools/make_single_exe.py
      # 端到端冒烟：真正运行最终 exe，验证「定位追加 payload → 解压 → 启动
      # 内层程序」。AVT_SELFTEST=crs 让主程序写完诊断文件后直接退出，无需窗口。
      - name: Smoke test single-file exe
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:LOCALAPPDATA 'AIVisionTool'
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          Start-Process -FilePath 'dist_single/AIVisionTool-Windows-x64.exe' -ArgumentList '--selftest=crs'
          $diag = Join-Path $root '坐标系诊断.txt'
          $deadline = (Get-Date).AddMinutes(6)
          while ((Get-Date) -lt $deadline) {
            if ((Test-Path $diag) -and
                (Select-String -Path $diag -Pattern 'stage=done' -SimpleMatch -Quiet)) { break }
            Start-Sleep -Seconds 2
          }
          $done = (Test-Path $diag) -and
            (Select-String -Path $diag -Pattern 'stage=done' -SimpleMatch -Quiet)
          if (-not $done) {
            foreach ($f in '启动标记.txt', '自检错误.txt', '坐标系诊断.txt', '启动器日志.log') {
              $p = Join-Path $root $f
              if (Test-Path $p) { Get-Content $p }
            }
            throw '冒烟失败：主程序自检未完成（见上方 stage/错误信息）'
          }
          Get-Content $diag
          $crsOk = (Select-String -Path $diag -Pattern 'working_reason=local_tm' -SimpleMatch -Quiet) -and
            (Select-String -Path $diag -Pattern 'roundtrip=ok' -SimpleMatch -Quiet) -and
            (Select-String -Path $diag -Pattern 'gdb_export=ok' -SimpleMatch -Quiet) -and
            (Select-String -Path $diag -Pattern 'web_assets=ok' -SimpleMatch -Quiet)
          if (-not $crsOk) { throw 'CRS 自检未覆盖工作系/往返/GDB 导出/前端资源' }
          Get-Content (Join-Path $root '启动器日志.log')
      - name: Write SHA256SUMS
        shell: pwsh
        run: |
          $h = (Get-FileHash dist_single/AIVisionTool-Windows-x64.exe -Algorithm SHA256).Hash.ToLower()
          "$h  AIVisionTool-Windows-x64.exe" | Set-Content dist_single/SHA256SUMS.txt -Encoding ascii
          Get-Content dist_single/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64
          path: |
            dist_single/AIVisionTool-Windows-x64.exe
            dist_single/SHA256SUMS.txt
          compression-level: 0   # 内容已压缩（payload 为 deflate），再压无收益
          retention-days: 7      # 自动过期，避免长期占用账号制品配额

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 默认 GITHUB_TOKEN 只读，创建 Release 需要写权限
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            AIVisionTool-macOS-arm64.zip
            AIVisionTool-Windows-x64.exe
            SHA256SUMS.txt
