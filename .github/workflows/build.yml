name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest          # 默认 arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime + build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt
      - name: Export YOLO11n -> ONNX
        run: python models/download_models.py
      - name: PyInstaller
        run: pyinstaller build.spec --noconfirm
      - name: Package .app
        run: ditto -c -k --sequesterRsrc dist/AIVisionTool.app AIVisionTool-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-arm64
          path: AIVisionTool-macOS-arm64.zip
          retention-days: 7   # 自动过期，避免长期占用账号 500MB 制品配额

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime + build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt
      - name: Export YOLO11n -> ONNX
        run: python models/download_models.py
      - name: PyInstaller
        run: pyinstaller build.spec --noconfirm
      - name: Package .exe
        run: Compress-Archive -Path dist/AIVisionTool -DestinationPath AIVisionTool-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64
          path: AIVisionTool-Windows-x64.zip
          retention-days: 7   # 自动过期，避免长期占用账号 500MB 制品配额

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 默认 GITHUB_TOKEN 只读，创建 Release 需要写权限
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            AIVisionTool-macOS-arm64.zip
            AIVisionTool-Windows-x64.zip
