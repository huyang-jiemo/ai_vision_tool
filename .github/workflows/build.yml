name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest          # 默认 arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime + build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt
      - name: Export YOLO11n -> ONNX
        run: python models/download_models.py
      - name: PyInstaller
        run: pyinstaller build.spec --noconfirm
      - name: Package .app
        run: ditto -c -k --sequesterRsrc dist/AIVisionTool.app AIVisionTool-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-arm64
          path: AIVisionTool-macOS-arm64.zip
          retention-days: 7   # 自动过期，避免长期占用账号 500MB 制品配额

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime + build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt
      - name: Export YOLO11n -> ONNX
        run: python models/download_models.py
      - name: PyInstaller
        run: pyinstaller build.spec --noconfirm
      # 无网交付：把 WebView2 固定版运行时（可再分发）直接打进包里，
      # 用户解压即可运行——零安装、零下载、无需管理员权限。
      # 构建期用官方独立安装器静默安装到 runner，再把运行时目录拷入包中。
      # 直链随版本变化且旧 fwlink 已失效（302 -> tbd），因此从微软官方
      # 自动维护的 winget 清单仓库解析最新版 x64 直链与 SHA256。
      - name: Bundle WebView2 runtime (fixed version, portable)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $H = @{ 'User-Agent' = 'ai-vision-tool-ci' }
          $vers = @(); $page = 1
          while ($page -le 30) {
            $r = Invoke-RestMethod "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/m/Microsoft/EdgeWebView2Runtime?per_page=100&page=$page" -Headers $H
            if (-not $r -or $r.Count -eq 0) { break }
            $vers += $r | ForEach-Object { $_.name }
            $page++
          }
          $latest = ($vers | Where-Object { $_ -match '^[\d.]+$' } |
            Sort-Object { [version]$_ } -Descending | Select-Object -First 1)
          if (-not $latest) { throw 'winget-pkgs 版本目录为空' }
          Write-Host "Latest WebView2 runtime: $latest"
          $yamlUrl = "https://raw.githubusercontent.com/microsoft/winget-pkgs/master/manifests/m/Microsoft/EdgeWebView2Runtime/$latest/Microsoft.EdgeWebView2Runtime.installer.yaml"
          $yaml = (Invoke-WebRequest $yamlUrl -Headers $H).Content
          $url = $null; $sha = $null; $want = $false
          foreach ($line in ($yaml -split "`r?`n")) {
            $s = $line.Trim()
            if ($s.EndsWith('Architecture: x64')) { $want = $true; $url = $null; $sha = $null; continue }
            if ($want -and (-not $url) -and $s.StartsWith('InstallerUrl:')) { $url = $s.Substring('InstallerUrl:'.Length).Trim() }
            if ($want -and $s.StartsWith('InstallerSha256:')) { $sha = $s.Substring('InstallerSha256:'.Length).Trim(); break }
          }
          if (-not $url) { throw '未解析到 x64 InstallerUrl' }
          Write-Host "InstallerUrl: $url"
          $exe = "$env:RUNNER_TEMP\MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
          curl.exe -L --fail --retry 3 -o $exe $url
          if ($sha) {
            $h = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
            if ($h -ne $sha.ToLower()) { throw "SHA256 校验失败：$h" }
          }
          # 静默安装到 runner（幂等；已装同/更新版本时安装器直接返回）
          Start-Process -FilePath $exe -ArgumentList '/silent', '/install' -Wait
          # 从系统安装目录拷出运行时（固定版等价物，微软允许随应用再分发）
          $appRoot = 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application'
          if (-not (Test-Path $appRoot)) { $appRoot = "$env:ProgramFiles\Microsoft\EdgeWebView\Application" }
          $verDir = Get-ChildItem $appRoot -Directory -ErrorAction Stop |
            Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not (Test-Path (Join-Path $verDir.FullName 'msedgewebview2.exe'))) {
            throw "运行时目录缺少 msedgewebview2.exe：$($verDir.FullName)"
          }
          Write-Host "Bundling runtime from: $($verDir.FullName)"
          New-Item -ItemType Directory -Path dist/AIVisionTool/webview2-runtime -Force | Out-Null
          Copy-Item "$($verDir.FullName)\*" 'dist/AIVisionTool/webview2-runtime/' -Recurse -Force
          Set-Content dist/AIVisionTool/webview2-runtime/VERSION "WebView2 Runtime $($verDir.Name) (fixed version, bundled)"
          $rt = Get-ChildItem dist/AIVisionTool/webview2-runtime -Recurse |
            Measure-Object -Property Length -Sum
          Write-Host "runtime files: $($rt.Count), $([int]($rt.Sum / 1MB)) MB"
      - name: Package .exe
        run: Compress-Archive -Path dist/AIVisionTool -DestinationPath AIVisionTool-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64
          path: AIVisionTool-Windows-x64.zip
          retention-days: 7   # 自动过期，避免长期占用账号 500MB 制品配额

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 默认 GITHUB_TOKEN 只读，创建 Release 需要写权限
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            AIVisionTool-macOS-arm64.zip
            AIVisionTool-Windows-x64.zip
