<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Vision Tool</title>
<style>
  /* ══════════ Design Tokens ══════════ */
  :root {
    --primary: #3370FF; --primary-600: #2B5CE6; --primary-050: #EEF3FF;
    --violet: #7C5CFF; --violet-050: #F0EDFF;
    --teal: #00A8A0; --teal-050: #E4F7F5;
    --amber: #E8890C; --amber-050: #FEF4E6;
    --green: #00B42A; --green-050: #E8FFEA;
    --red: #F53F3F; --red-050: #FFECE8;

    --ink-1: #1D2129; --ink-2: #4E5969; --ink-3: #86909C; --ink-4: #C2C7D0;
    --line: #ECEEF1; --line-2: #DFE3E8;
    --bg: #F4F5F7; --card: #FFFFFF; --hover: #F7F8FA;

    --r-sm: 8px; --r-md: 10px; --r-lg: 14px;
    --sh-1: 0 1px 2px rgba(29,33,41,.04), 0 1px 4px rgba(29,33,41,.04);
    --sh-2: 0 2px 6px rgba(29,33,41,.06), 0 8px 24px rgba(29,33,41,.06);
    --sh-btn: 0 2px 8px rgba(43,92,230,.28);
    --ease: 160ms cubic-bezier(.4,0,.2,1);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--ink-1); font-size: 14px;
         display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
  .num { font-variant-numeric: tabular-nums; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  /* ══════════ 顶栏 ══════════ */
  header { height: 56px; background: var(--card); border-bottom: 1px solid var(--line);
           display: flex; align-items: center; justify-content: space-between;
           padding: 0 22px; flex-shrink: 0; }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand svg { width: 34px; height: 34px; border-radius: 9px; box-shadow: 0 3px 8px rgba(28,63,124,.30); }
  .brand .tt { display: flex; flex-direction: column; line-height: 1.25; }
  .brand .name { font-size: 15px; font-weight: 700; letter-spacing: .2px; }
  .brand .sub { font-size: 11px; color: var(--ink-3); }
  .badge-ver { font-size: 10px; color: #fff; background: linear-gradient(135deg,#4F7DFF,#7C5CFF);
               padding: 2px 8px; border-radius: 10px; font-weight: 600; align-self: center; }
  .model { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2);
           background: var(--hover); border: 1px solid var(--line); padding: 6px 13px;
           border-radius: 20px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-4); }
  .dot.ok { background: var(--green); box-shadow: 0 0 0 3px rgba(0,180,42,.14); }
  .dot.no { background: var(--red); box-shadow: 0 0 0 3px rgba(245,63,63,.14); }

  /* ══════════ 主体 ══════════ */
  main { flex: 1; overflow: auto; padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg);
          padding: 16px 22px; box-shadow: var(--sh-1); }

  .card-head { display: flex; align-items: center; gap: 10px; padding-bottom: 12px;
               border-bottom: 1px solid var(--line); }
  .card-head .ht { display: flex; flex-direction: column; }
  .card-head .t1 { font-size: 14px; font-weight: 700; }
  .card-head .t2 { font-size: 11px; color: var(--ink-3); margin-top: 1px; }
  .ticon { width: 30px; height: 30px; border-radius: 9px; display: inline-flex; align-items: center;
           justify-content: center; flex-shrink: 0; box-shadow: var(--sh-1); }
  .ticon svg { width: 16px; height: 16px; }
  .ticon.blue { background: linear-gradient(135deg,#4F7DFF,#3370FF); color: #fff; }
  .ticon.violet { background: linear-gradient(135deg,#9B7BFF,#7C5CFF); color: #fff; }
  .ticon.dark { background: linear-gradient(135deg,#414652,#1E2126); color: #fff; }
  .ticon.teal { background: linear-gradient(135deg,#1FC7BC,#00A8A0); color: #fff; }
  .spacer { flex: 1; }

  /* ══════════ 配置区 ══════════ */
  .cfg-grid { display: flex; gap: 14px; margin-top: 14px; flex-wrap: wrap; align-items: flex-end; }
  .cfg-field { display: flex; flex-direction: column; }
  .cfg-field.w1 { flex: 1.35; min-width: 250px; }
  .cfg-field.w3 { width: 116px; }
  .cfg-field label { font-size: 12px; color: var(--ink-2); margin-bottom: 6px; font-weight: 500; }
  input[type=text], input[type=number] { width: 100%; height: 36px; padding: 0 11px;
         border: 1px solid var(--line-2); border-radius: var(--r-sm); font-size: 13px;
         color: var(--ink-1); outline: none; background: var(--card);
         transition: border-color var(--ease), box-shadow var(--ease); }
  input:hover { border-color: var(--ink-4); }
  input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(51,112,255,.10); }
  input::placeholder { color: var(--ink-3); }
  .path-row { display: flex; gap: 8px; }
  .path-row input { flex: 1; min-width: 0; }

  button { border: 0; border-radius: var(--r-sm); font-size: 13px; cursor: pointer;
           font-family: inherit; transition: background var(--ease), box-shadow var(--ease),
           transform var(--ease), opacity var(--ease); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .primary { background: linear-gradient(135deg,#4F7DFF,#2B5CE6); color: #fff; height: 38px;
             padding: 0 22px; font-weight: 600; box-shadow: var(--sh-btn); }
  .primary:hover:not(:disabled) { background: linear-gradient(135deg,#3D6EFF,#234FD1);
             transform: translateY(-1px); box-shadow: 0 4px 12px rgba(43,92,230,.36); }
  .primary:active:not(:disabled) { transform: translateY(0); }
  .primary.big { font-size: 14px; }
  .primary.sm { height: 36px; padding: 0 15px; font-size: 13px; }
  .primary.sm svg { width: 15px; height: 15px; }
  .ghost { background: var(--card); color: var(--primary); border: 1px solid var(--line-2);
           height: 36px; padding: 0 13px; display: inline-flex; align-items: center; gap: 6px;
           white-space: nowrap; font-weight: 500; }
  .ghost:hover:not(:disabled) { background: var(--primary-050); border-color: var(--primary); }
  .ghost.sq { width: 36px; padding: 0; justify-content: center; }
  .ghost svg { width: 15px; height: 15px; }
  .checks { display: flex; gap: 18px; align-items: center; height: 36px; }
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
            color: var(--ink-1); font-size: 13px; margin: 0; height: 36px;
            padding: 0 4px; user-select: none; font-weight: 500; }
  .switch input { display: none; }
  .switch .track { width: 36px; height: 20px; border-radius: 10px; background: #D5DAE2;
                   position: relative; transition: background var(--ease); flex-shrink: 0; }
  .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px;
                   height: 16px; border-radius: 50%; background: #fff;
                   box-shadow: 0 1px 3px rgba(0,0,0,.22); transition: transform var(--ease); }
  .switch input:checked + .track { background: var(--primary); }
  .switch input:checked + .track::after { transform: translateX(16px); }
  .switch:hover .track { background: #C3C9D4; }
  .switch input:checked:hover + .track { background: var(--primary); }
  .hint { font-size: 12px; color: var(--ink-3); margin-top: 10px; line-height: 1.6; word-break: break-all; }
  .hint.ok { color: var(--green); }
  .hint.err { color: var(--red); }

  /* ══════════ 下区 ══════════ */
  .bottom { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px;
            flex: 1; min-height: 0; align-items: stretch; }
  .bottom > .card { display: flex; flex-direction: column; min-height: 0; }
  #runView { flex: 1; min-height: 0; flex-direction: column; }
  .right-col { display: flex; flex-direction: column; gap: 14px; min-width: 0; min-height: 0; }
  .right-col .card { display: flex; flex-direction: column; min-height: 0; }
  .right-col .card:first-of-type { flex: 1; }

  .chip { font-size: 12px; padding: 3px 12px; border-radius: 20px; font-weight: 600; }
  .chip.idle { background: var(--hover); color: var(--ink-3); }
  .chip.run { background: var(--primary-050); color: var(--primary); }
  .chip.run::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
                      background: var(--primary); margin-right: 5px; vertical-align: 1px;
                      animation: pulse 1.2s ease-in-out infinite; }
  .chip.done { background: var(--green-050); color: var(--green); }
  .chip.fail { background: var(--red-050); color: var(--red); }
  @keyframes pulse { 50% { opacity: .25; } }

  /* ══════════ 进度 ══════════ */
  .pct-row { display: flex; align-items: baseline; justify-content: space-between; margin: 16px 0 8px; }
  .pct { font-size: 40px; font-weight: 800; letter-spacing: -1.5px; line-height: 1;
         background: linear-gradient(135deg,#3370FF,#7C5CFF);
         -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .pct small { font-size: 16px; -webkit-text-fill-color: var(--ink-3); font-weight: 500; }
  .pct-sub { font-size: 12px; color: var(--ink-3); }
  .bar { height: 10px; background: var(--hover); border-radius: 6px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; border-radius: 6px; transition: width .25s ease;
               background: linear-gradient(90deg,#3370FF,#7C5CFF); position: relative; }
  .bar > div::after { content: ""; position: absolute; inset: 0;
               background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
               animation: shine 1.6s linear infinite; }
  @keyframes shine { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 16px; }
  .tile { border-radius: var(--r-md); padding: 10px 12px; display: flex; align-items: center; gap: 9px; }
  .tile .tic { width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center;
               justify-content: center; flex-shrink: 0; }
  .tile .tic svg { width: 16px; height: 16px; }
  .tile .k { font-size: 10.5px; color: var(--ink-3); white-space: nowrap; }
  .tile .v { font-size: 18px; font-weight: 700; line-height: 1.15; white-space: nowrap; }
  .tile.total { background: var(--primary-050); }
  .tile.total .tic { background: #fff; color: var(--primary); } .tile.total .v { color: var(--primary); }
  .tile.ok { background: var(--green-050); }
  .tile.ok .tic { background: #fff; color: var(--green); } .tile.ok .v { color: var(--green); }
  .tile.bad { background: var(--red-050); }
  .tile.bad .tic { background: #fff; color: var(--red); } .tile.bad .v { color: var(--red); }
  .tile.time { background: var(--amber-050); }
  .tile.time .tic { background: #fff; color: var(--amber); } .tile.time .v { color: var(--amber); }

  /* ══════════ 文件队列 ══════════ */
  .files-head { display: flex; align-items: center; gap: 8px; margin: 16px 0 8px; }
  .files-head .fh-t { font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-right: 2px; }
  .fchip { font-size: 11px; padding: 3px 10px; border-radius: 12px; cursor: pointer;
           background: var(--hover); border: 1px solid transparent; color: var(--ink-3);
           transition: all var(--ease); }
  .fchip:hover { border-color: var(--line-2); }
  .fchip.on { background: var(--ink-1); color: #fff; font-weight: 600; }
  .files-head .cnt { margin-left: auto; font-size: 11.5px; color: var(--ink-3); }

  .file-list { flex: 1; min-height: 140px; overflow: auto; border: 1px solid var(--line);
               border-radius: var(--r-md); }
  .file-list:empty::after { content: "选择数据源并开始解译后，此处展示文件队列"; display: block;
               padding: 22px 14px; text-align: center; color: var(--ink-4); font-size: 12px; }
  .frow { display: flex; align-items: center; gap: 10px; padding: 7px 13px;
          border-bottom: 1px solid var(--line); font-size: 12.5px; transition: background var(--ease); }
  .frow:last-child { border-bottom: 0; }
  .frow:hover { background: var(--hover); }
  .frow .fic { width: 18px; height: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .frow .fic svg { width: 15px; height: 15px; }
  .fic.pending { color: var(--ink-4); }
  .fic.done { color: var(--green); }
  .fic.failed { color: var(--red); }
  .spinner { width: 13px; height: 13px; border: 2px solid var(--primary-050);
             border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fname { flex: 1; font-family: ui-monospace, Menlo, monospace; font-size: 12px;
           color: var(--ink-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fmeta { color: var(--ink-3); font-size: 11.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ftag { font-size: 11px; padding: 1px 9px; border-radius: 10px; white-space: nowrap; font-weight: 500; }
  .ftag.pending { background: var(--hover); color: var(--ink-3); }
  .ftag.done { background: var(--green-050); color: var(--green); }
  .ftag.failed { background: var(--red-050); color: var(--red); }
  .ftag.running { background: var(--primary-050); color: var(--primary); }

  /* ══════════ 日志 ══════════ */
  .log { background: #17191C; color: #C9D4E3; font-family: ui-monospace, Menlo, monospace;
         font-size: 12px; line-height: 1.75; flex: 1; min-height: 160px; overflow: auto;
         padding: 13px 15px; border-radius: var(--r-md); white-space: pre-wrap; word-break: break-all; }
  .log:empty::before { content: "日志将在此处输出"; color: #5B6470; }

  /* ══════════ 结果 ══════════ */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border-bottom: 1px solid var(--line); padding: 9px 10px; text-align: left; }
  th { color: var(--ink-3); font-weight: 500; font-size: 12px; background: var(--hover); }
  th:not(:first-child), td:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: 0; }
  td .num { font-weight: 700; color: var(--primary); }
  #resultBody:empty::after { content: "解译完成后，此处展示各批次矢量统计"; display: block;
               padding: 16px 2px; color: var(--ink-3); font-size: 12.5px; }

  /* ══════════ 空状态 ══════════ */
  .empty { text-align: center; padding: 34px 0 26px; color: var(--ink-3); }
  .empty .art { width: 84px; height: 60px; margin: 0 auto 12px; }

  .error-box { margin-top: 12px; background: var(--red-050); color: var(--red);
               border-radius: var(--r-sm); padding: 10px 12px; font-size: 13px; word-break: break-all; }

  #toast { position: fixed; top: 66px; left: 50%; transform: translateX(-50%) translateY(-8px);
           background: #FFFFFF; border: 1px solid var(--line); box-shadow: var(--sh-2);
           border-radius: var(--r-md); padding: 10px 18px; font-size: 13px; opacity: 0;
           pointer-events: none; transition: opacity .2s, transform .2s; max-width: 70%; z-index: 99;
           display: flex; align-items: center; gap: 8px; }
  #toast .tico { width: 17px; height: 17px; flex-shrink: 0; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.err { color: var(--red); }
  #toast.good { color: var(--green); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2F6FD0"/><stop offset="1" stop-color="#1B3D7C"/>
      </linearGradient></defs>
      <rect width="1024" height="1024" rx="230" fill="url(#lg)"/>
      <path d="M512 862 C 498 846 368 690 336 632 C 311 587 298 541 298 494 C 298 374 394 278 512 278 C 630 278 726 374 726 494 C 726 541 713 587 688 632 C 656 690 526 846 512 862 Z" fill="#FFFFFF"/>
      <path d="M436 612 L464 384 L560 384 L588 612 Z" fill="#1B3D7C"/>
      <g fill="#FFFFFF"><rect x="501" y="552" width="22" height="34" rx="6"/><rect x="501" y="484" width="22" height="34" rx="6"/><rect x="501" y="416" width="22" height="34" rx="6"/></g>
    </svg>
    <div class="tt"><span class="name">众源感知自动解译工具</span></div>
    <span class="badge-ver">v0.2.3</span>
  </div>
  <div class="model"><span class="dot" id="modelDot"></span><span id="modelText">正在加载模型</span></div>
</header>

<main>
  <!-- 上：解译配置 -->
  <div class="card">
    <div class="card-head">
      <span class="ticon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></span>
      <div class="ht"><span class="t1">解译配置</span><span class="t2">选择数据源与输出位置，其余参数保持默认即可</span></div>
      <span class="spacer"></span>
      <button class="primary big" id="runBtn" disabled>开始解译</button>
    </div>
    <div class="cfg-grid">
      <div class="cfg-field w1">
        <label>数据源目录</label>
        <div class="path-row">
          <input type="text" id="dataDir" placeholder="包含按批次配对的 照片/ 与 轨迹/" />
          <button class="primary sm" id="browseData" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>选择</button>
        </div>
      </div>
      <div class="cfg-field w1">
        <label>输出目录</label>
        <div class="path-row">
          <input type="text" id="outDir" placeholder="解译结果保存位置" />
          <button class="primary sm" id="browseOut" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>选择</button>
        </div>
      </div>
      <div class="cfg-field w3">
        <label>置信度阈值</label>
        <input type="number" id="conf" value="0.35" step="0.05" min="0.1" max="0.9" />
      </div>
      <div class="cfg-field w3">
        <label>最大影像数</label>
        <input type="number" id="maxImg" value="0" min="0" />
      </div>
      <div class="checks">
        <label class="switch"><input type="checkbox" id="fisheye" checked /><span class="track"></span>鱼眼矫正</label>
        <label class="switch"><input type="checkbox" id="gdb" checked /><span class="track"></span>导出 GDB</label>
      </div>
    </div>
    <div id="scanInfo" class="hint">数据源目录需包含按批次同名配对的 照片/ 与 轨迹/ 子目录</div>
  </div>

  <!-- 下：左进度 / 右日志+结果 -->
  <div class="bottom">
    <div class="card">
      <div class="card-head">
        <span class="ticon violet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></span>
        <div class="ht"><span class="t1">解译进度</span><span class="t2">整体进度与逐文件状态</span></div>
        <span class="spacer"></span>
        <span id="stateChip" class="chip idle">待机</span>
      </div>

      <div id="runView">
        <div class="pct-row">
          <span class="pct num" id="pct">0<small>%</small></span>
          <span class="pct-sub num" id="pctSub">0 / 0</span>
        </div>
        <div class="bar"><div id="bar"></div></div>
        <div class="tiles">
          <div class="tile total"><span class="tic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.8"/><path d="M21 15l-5-5L5 21"/></svg></span><div><div class="k">总数</div><div class="v num" id="tTotal">0</div></div></div>
          <div class="tile ok"><span class="tic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span><div><div class="k">成功</div><div class="v num" id="tOk">0</div></div></div>
          <div class="tile bad"><span class="tic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></span><div><div class="k">失败</div><div class="v num" id="tBad">0</div></div></div>
          <div class="tile time"><span class="tic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span><div><div class="k">已用时</div><div class="v num" id="tTime">00:00</div></div></div>
        </div>
        <div class="files-head">
          <span class="fh-t">文件队列</span>
          <button class="fchip on" data-f="all" type="button">全部</button>
          <button class="fchip" data-f="done" type="button">成功</button>
          <button class="fchip" data-f="failed" type="button">失败</button>
          <span class="cnt num" id="fCount"></span>
        </div>
        <div id="fileList" class="file-list"></div>
        <div id="errBox" class="error-box" style="display:none"></div>
      </div>
    </div>

    <div class="right-col">
      <div class="card">
        <div class="card-head">
          <span class="ticon dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6-6-6M12 19h8"/></svg></span>
          <div class="ht"><span class="t1">运行日志</span><span class="t2">解译过程实时输出</span></div>
        </div>
        <div id="log" class="log"></div>
      </div>

      <div class="card" id="resultCard">
        <div class="card-head">
          <span class="ticon teal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span>
          <div class="ht"><span class="t1">解译结果</span><span class="t2">各批次矢量统计</span></div>
          <span class="spacer"></span>
          <button class="primary sm" id="openOut2" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1h-8.6a1 1 0 0 1-.83-.45L9.4 4.45A1 1 0 0 0 8.57 4H4a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1z"/><path d="M11 16V9M8 12l3-3 3 3"/></svg>
            打开输出目录</button>
        </div>
        <div id="resultBody" style="margin-top:6px"></div>
      </div>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
/* ---------- 基础设施 ---------- */
function call(name, ...args) { return window.pywebview.api[name](...args); }
function el(id) { return document.getElementById(id); }
let toastTimer = null;
function toast(msg, kind) {
  const t = el('toast');
  const ico = kind === 'err'
    ? '<svg class="tico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>'
    : '<svg class="tico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
  t.innerHTML = ico + '<span>' + msg + '</span>';
  t.className = (kind || 'good') + ' show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
function fmtElapsed(ms) {
  const s = Math.floor(ms / 1000);
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
const ICONS = {
  done: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  failed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  pending: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="8"/></svg>',
};

/* ---------- 状态 ---------- */
let runStartTs = 0, elapsedTimer = null, fileFilter = 'all';
const CHIP = { idle: ['idle', '待机'], run: ['run', '解译中'], done: ['done', '已完成'], fail: ['fail', '失败'] };
function setChip(state) {
  const [cls, text] = CHIP[state] || CHIP.idle;
  el('stateChip').className = 'chip ' + cls;
  el('stateChip').textContent = text;
}

window.addEventListener('pywebviewready', async () => {
  const st = await call('model_status');
  if (st.available) {
    el('modelDot').className = 'dot ok';
    el('modelText').textContent = '检测模型已就绪';
  } else {
    el('modelDot').className = 'dot no';
    el('modelText').textContent = '模型缺失，仅提取车道线';
  }
});

/* ---------- 目录选择 / 打开 ---------- */
async function pickDir(inputId, title) {
  try {
    const r = await call('pick_folder', title);
    if (r && r.ok && r.path) { el(inputId).value = r.path; return r.path; }
    if (r && r.error) toast('无法打开目录选择器：' + r.error, 'err');
  } catch (e) { toast('无法打开目录选择器：' + e, 'err'); }
  return null;
}
async function openOutDir() {
  const p = el('outDir').value.trim();
  if (!p) { toast('请先选择输出目录', 'err'); return; }
  const r = await call('open_folder', p);
  if (!r.ok) toast(r.error || '打开失败', 'err');
}
el('browseData').onclick = async () => { if (await pickDir('dataDir', '选择数据源目录')) scanDir(); };
el('browseOut').onclick = () => pickDir('outDir', '选择输出目录');
el('openOut2').onclick = openOutDir;

/* ---------- 扫描 ---------- */
let lastScan = { dir: '', matched: -1 };
async function scanDir() {
  const d = el('dataDir').value.trim();
  const info = el('scanInfo');
  if (!d) { info.textContent = '请选择数据源目录'; info.className = 'hint'; return; }
  if (lastScan.dir === d && lastScan.matched >= 0) return;
  info.textContent = '正在扫描数据源…';
  info.className = 'hint';
  const r = await call('scan_directory', d);
  lastScan = { dir: d, matched: r.matched };
  if (r.error) {
    info.textContent = '扫描失败：' + r.error; info.className = 'hint err';
    el('runBtn').disabled = true; return;
  }
  info.textContent = `影像 ${r.images} · 位姿 ${r.poses} · 可配对 ${r.matched}`;
  info.className = 'hint' + (r.matched > 0 ? ' ok' : '');
  el('runBtn').disabled = r.matched === 0;
  if (r.matched === 0) info.textContent += '，请检查目录结构';
}
el('dataDir').addEventListener('change', () => { lastScan = { dir: '', matched: -1 }; scanDir(); });
el('dataDir').addEventListener('keydown', e => { if (e.key === 'Enter') { lastScan = { dir: '', matched: -1 }; scanDir(); } });

/* ---------- 筛选 ---------- */
document.querySelectorAll('.fchip').forEach(c => {
  c.onclick = () => {
    document.querySelectorAll('.fchip').forEach(x => x.classList.remove('on'));
    c.classList.add('on');
    fileFilter = c.dataset.f;
    renderFiles(lastFiles, lastCurrent);
  };
});

/* ---------- 启动解译 ---------- */
el('runBtn').onclick = async () => {
  const dataDir = el('dataDir').value.trim();
  const outDir = el('outDir').value.trim();
  if (!dataDir || !outDir) { toast('请先选择数据源目录与输出目录', 'err'); return; }
  await scanDir();
  if (lastScan.matched === 0) { toast('数据源中没有可配对的影像', 'err'); return; }

  const r = await call('start_pipeline', dataDir, outDir,
    parseFloat(el('conf').value), parseInt(el('maxImg').value, 10) || null,
    el('fisheye').checked, el('gdb').checked);
  if (!r.started) { toast(r.error || '启动失败', 'err'); return; }

  runStartTs = Date.now();
  setChip('run');
  el('errBox').style.display = 'none';
  el('runBtn').disabled = true;
  clearInterval(elapsedTimer);
  elapsedTimer = setInterval(() => { el('tTime').textContent = fmtElapsed(Date.now() - runStartTs); }, 500);
  poll();
};

/* ---------- 轮询 ---------- */
let lastFiles = [], lastCurrent = '';
function poll() {
  const timer = setInterval(async () => {
    let s;
    try { s = await call('get_status'); } catch (e) { return; }
    const pct = s.total ? Math.round(s.progress / s.total * 100) : 0;
    el('pct').innerHTML = pct + '<small>%</small>';
    el('pctSub').textContent = `${s.progress || 0} / ${s.total || 0}`;
    el('bar').style.width = pct + '%';
    el('tTotal').textContent = s.total || 0;
    const okN = (s.files || []).filter(f => f.status === 'done').length;
    const badN = (s.files || []).filter(f => f.status === 'failed').length;
    el('tOk').textContent = okN;
    el('tBad').textContent = badN;
    el('fCount').textContent = s.total ? `${okN + badN} / ${s.total}` : '';
    const log = el('log');
    log.textContent = s.logs.join('\n');
    log.scrollTop = log.scrollHeight;
    lastFiles = s.files || []; lastCurrent = s.current;
    renderFiles(lastFiles, lastCurrent);

    if (s.state === 'done' || s.state === 'error') {
      clearInterval(timer); clearInterval(elapsedTimer);
      el('tTime').textContent = fmtElapsed(Date.now() - runStartTs);
      el('runBtn').disabled = false;
      if (s.state === 'error') {
        setChip('fail');
        el('errBox').style.display = 'block';
        el('errBox').textContent = s.error || '发生未知错误';
        toast('解译失败', 'err');
      } else {
        setChip('done');
        toast(`解译完成，成功 ${okN} 张` + (badN ? `，失败 ${badN} 张` : ''), 'good');
        if (s.result) showResult(s.result);
      }
    }
  }, 400);
}

/* ---------- 文件队列 ---------- */
function renderFiles(files, current) {
  const box = el('fileList');
  if (!files.length) { box.innerHTML = ''; return; }
  const keepScroll = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  const shown = fileFilter === 'all' ? files : files.filter(f => {
    if (fileFilter === 'done') return f.status === 'done';
    if (fileFilter === 'failed') return f.status === 'failed';
    return f.status === 'pending';
  });
  let html = '';
  for (const f of shown) {
    const running = f.status === 'pending' && f.name === current;
    const cls = running ? 'running' : f.status;
    let ic, tag;
    if (f.status === 'done') { ic = ICONS.done; tag = '<span class="ftag done">完成</span>'; }
    else if (f.status === 'failed') { ic = ICONS.failed; tag = '<span class="ftag failed">失败</span>'; }
    else if (running) { ic = '<span class="spinner"></span>'; tag = '<span class="ftag running">处理中</span>'; }
    else { ic = ICONS.pending; tag = '<span class="ftag pending">等待</span>'; }
    const meta = f.status === 'done' ? `目标 ${f.det} · 车道线 ${f.lane}` : '';
    html += `<div class="frow"><span class="fic ${cls}">${ic}</span><span class="fname">${f.name}</span><span class="fmeta">${meta}</span>${tag}</div>`;
  }
  box.innerHTML = html || '<div class="frow" style="color:var(--ink-3)">该筛选下暂无文件</div>';
  if (keepScroll) box.scrollTop = box.scrollHeight;
}

/* ---------- 结果 ---------- */
function showResult(r) {
  let html = '<table><tr><th>批次</th><th>目标数</th><th>车道线数</th></tr>';
  for (const [k, v] of Object.entries(r.per_session)) {
    html += `<tr><td>${k}</td><td><span class="num">${v.det}</span></td><td><span class="num">${v.lane}</span></td></tr>`;
  }
  html += '</table>';
  html += `<div class="hint">时序变化要素 ${r.change_count} 条</div>`;
  if (r.change_path) html += `<div class="hint">${r.change_path}</div>`;
  el('resultBody').innerHTML = html;
}
</script>
</body>
</html>
