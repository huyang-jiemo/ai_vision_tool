<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Vision Tool</title>
<style>
  :root {
    --primary: #3370FF; --primary-hover: #2860E1; --primary-light: #EAF0FF;
    --text-1: #1D2129; --text-2: #4E5969; --text-3: #86909C;
    --border: #E5E6EB; --border-strong: #C9CDD4;
    --bg: #F2F3F5; --card: #FFFFFF;
    --success: #00B42A; --success-bg: #E8FFEA;
    --danger: #F53F3F; --danger-bg: #FFECE8;
    --running-bg: #EAF0FF;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--text-1); font-size: 14px;
         display: flex; flex-direction: column; }

  /* ── 顶栏 ── */
  header { height: 56px; background: var(--card); border-bottom: 1px solid var(--border);
           display: flex; align-items: center; justify-content: space-between;
           padding: 0 20px; flex-shrink: 0; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 30px; height: 30px; border-radius: 7px; }
  .brand .name { font-size: 15px; font-weight: 600; }
  .brand .ver { font-size: 11px; color: var(--text-3); margin-left: 6px; font-weight: 400; }
  .model { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border-strong); }
  .dot.ok { background: var(--success); }
  .dot.no { background: var(--danger); }

  /* ── 主体双栏 ── */
  main { flex: 1; overflow: auto; padding: 16px 20px;
         display: grid; grid-template-columns: 420px 1fr; gap: 16px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
          padding: 18px 20px; }
  .card-title { font-size: 14px; font-weight: 600; margin-bottom: 14px;
                display: flex; align-items: center; justify-content: space-between; }

  label { display: block; font-size: 13px; color: var(--text-2); margin: 12px 0 6px; }
  label:first-of-type { margin-top: 0; }
  input[type=text], input[type=number] { width: 100%; height: 34px; padding: 0 10px;
         border: 1px solid var(--border-strong); border-radius: 8px; font-size: 13px;
         color: var(--text-1); outline: none; transition: border-color .15s, box-shadow .15s; }
  input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(51,112,255,.12); }
  input::placeholder { color: var(--text-3); }

  .path-row { display: flex; gap: 8px; }
  .path-row input { flex: 1; min-width: 0; }

  button { border: 0; border-radius: 8px; font-size: 13px; cursor: pointer;
           font-family: inherit; transition: background .15s, opacity .15s; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .primary { background: var(--primary); color: #fff; height: 36px; padding: 0 18px; }
  .primary:hover:not(:disabled) { background: var(--primary-hover); }
  .primary.big { width: 100%; height: 40px; font-size: 14px; font-weight: 600; margin-top: 16px; }
  .ghost { background: var(--card); color: var(--primary); border: 1px solid var(--border-strong);
           height: 34px; padding: 0 12px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .ghost:hover:not(:disabled) { background: var(--primary-light); border-color: var(--primary); }
  .ghost.sq { width: 34px; padding: 0; justify-content: center; }
  .ghost svg { width: 14px; height: 14px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .checks { display: flex; gap: 20px; margin-top: 14px; }
  .check { display: flex; align-items: center; gap: 6px; margin: 0; cursor: pointer; color: var(--text-1); }
  .check input { accent-color: var(--primary); }

  .hint { font-size: 12px; color: var(--text-3); margin-top: 10px; line-height: 1.6; word-break: break-all; }
  .hint.ok { color: var(--success); }
  .hint.err { color: var(--danger); }

  /* ── 状态徽标 ── */
  .chip { font-size: 12px; padding: 2px 10px; border-radius: 20px; font-weight: 400; }
  .chip.idle { background: var(--bg); color: var(--text-3); }
  .chip.run { background: var(--running-bg); color: var(--primary); }
  .chip.run::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
                      background: var(--primary); margin-right: 5px; vertical-align: 1px;
                      animation: pulse 1.2s ease-in-out infinite; }
  .chip.done { background: var(--success-bg); color: var(--success); }
  .chip.fail { background: var(--danger-bg); color: var(--danger); }
  @keyframes pulse { 50% { opacity: .25; } }

  /* ── 空状态 ── */
  .empty { text-align: center; padding: 46px 0 34px; color: var(--text-3); }
  .empty svg { width: 44px; height: 44px; opacity: .4; margin-bottom: 12px; }
  .empty p { font-size: 13px; }

  /* ── 进度 ── */
  .pct-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .pct { font-size: 34px; font-weight: 700; letter-spacing: -.5px; }
  .pct small { font-size: 15px; font-weight: 400; color: var(--text-3); }
  .bar { height: 8px; background: var(--bg); border-radius: 6px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--primary); border-radius: 6px;
               transition: width .25s ease; }
  .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin-top: 16px; }
  .meta .k { font-size: 12px; color: var(--text-3); margin-bottom: 3px; }
  .meta .v { font-size: 13px; color: var(--text-1); word-break: break-all; }
  .error-box { margin-top: 14px; background: var(--danger-bg); color: var(--danger);
               border-radius: 8px; padding: 10px 12px; font-size: 13px; word-break: break-all; }

  /* ── 日志 ── */
  .log { background: #17191C; color: #C9D4E3; font-family: ui-monospace, Menlo, monospace;
         font-size: 12px; line-height: 1.7; height: 220px; overflow: auto; padding: 12px 14px;
         border-radius: 8px; white-space: pre-wrap; word-break: break-all; }
  .log:empty::before { content: "日志将在此处输出"; color: #5B6470; }

  /* ── 结果表 ── */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border-bottom: 1px solid var(--border); padding: 9px 10px; text-align: left; }
  th { color: var(--text-3); font-weight: 500; font-size: 12px; background: #FAFBFC; }
  tr:last-child td { border-bottom: 0; }

  /* ── Toast ── */
  #toast { position: fixed; top: 68px; left: 50%; transform: translateX(-50%) translateY(-8px);
           background: #FFFFFF; border: 1px solid var(--border); box-shadow: 0 6px 24px rgba(0,0,0,.10);
           border-radius: 8px; padding: 9px 16px; font-size: 13px; opacity: 0;
           pointer-events: none; transition: opacity .2s, transform .2s; max-width: 70%; z-index: 99; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.err { color: var(--danger); border-color: #FDCDC5; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2F6FD0"/><stop offset="1" stop-color="#1B3D7C"/>
      </linearGradient></defs>
      <rect width="1024" height="1024" rx="230" fill="url(#lg)"/>
      <path d="M512 862 C 498 846 368 690 336 632 C 311 587 298 541 298 494 C 298 374 394 278 512 278 C 630 278 726 374 726 494 C 726 541 713 587 688 632 C 656 690 526 846 512 862 Z" fill="#FFFFFF"/>
      <path d="M436 612 L464 384 L560 384 L588 612 Z" fill="#1B3D7C"/>
      <g fill="#FFFFFF"><rect x="501" y="552" width="22" height="34" rx="6"/><rect x="501" y="484" width="22" height="34" rx="6"/><rect x="501" y="416" width="22" height="34" rx="6"/></g>
    </svg>
    <div><span class="name">众源感知自动解译工具</span><span class="ver">v0.2</span></div>
  </div>
  <div class="model"><span class="dot" id="modelDot"></span><span id="modelText">正在加载模型</span></div>
</header>

<main>
  <!-- 左栏：配置 -->
  <div class="col">
    <div class="card">
      <div class="card-title">解译配置</div>

      <label>数据源目录</label>
      <div class="path-row">
        <input type="text" id="dataDir" placeholder="包含 照片/ 与 轨迹/ 的目录" />
        <button class="ghost" id="browseData" type="button">选择</button>
      </div>

      <label>输出目录</label>
      <div class="path-row">
        <input type="text" id="outDir" placeholder="解译结果保存位置" />
        <button class="ghost" id="browseOut" type="button">选择</button>
        <button class="ghost sq" id="openOut" type="button" title="打开输出目录">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M14 14l3-3 3 3"/><path d="M17 11v6"/></svg>
        </button>
      </div>

      <div class="grid2">
        <div>
          <label>置信度阈值</label>
          <input type="number" id="conf" value="0.35" step="0.05" min="0.1" max="0.9" />
        </div>
        <div>
          <label>最大影像数</label>
          <input type="number" id="maxImg" value="0" min="0" />
        </div>
      </div>

      <div class="checks">
        <label class="check"><input type="checkbox" id="fisheye" checked />鱼眼矫正</label>
        <label class="check"><input type="checkbox" id="gdb" checked />导出 GDB</label>
      </div>

      <button id="runBtn" class="primary big" disabled>开始解译</button>
      <div id="scanInfo" class="hint">数据源目录需包含按期次同名配对的 照片/ 与 轨迹/ 子目录</div>
    </div>
  </div>

  <!-- 右栏：执行 -->
  <div class="col">
    <div class="card">
      <div class="card-title">执行状态 <span id="stateChip" class="chip idle">待机</span></div>

      <div id="emptyView" class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <p>选择数据源与输出目录后开始解译</p>
      </div>

      <div id="runView" style="display:none">
        <div class="pct-row"><span class="pct" id="pct">0<small>%</small></span></div>
        <div class="bar"><div id="bar"></div></div>
        <div class="meta">
          <div><div class="k">处理进度</div><div class="v" id="mCount">—</div></div>
          <div><div class="k">已用时</div><div class="v" id="mElapsed">—</div></div>
          <div style="grid-column:1/-1"><div class="k">当前文件</div><div class="v" id="mFile">—</div></div>
        </div>
        <div id="errBox" class="error-box" style="display:none"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">运行日志</div>
      <div id="log" class="log"></div>
    </div>

    <div class="card" id="resultCard" style="display:none">
      <div class="card-title">解译结果
        <button class="ghost" id="openOut2" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M14 14l3-3 3 3"/><path d="M17 11v6"/></svg>
          打开输出目录
        </button>
      </div>
      <div id="resultBody"></div>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
/* ---------- 基础设施 ---------- */
function call(name, ...args) {
  return window.pywebview.api[name](...args);
}
let toastTimer = null;
function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = isErr ? 'err show' : 'show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
function el(id) { return document.getElementById(id); }
function fmtElapsed(ms) {
  const s = Math.floor(ms / 1000);
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

/* ---------- 状态 ---------- */
let runStartTs = 0;
let elapsedTimer = null;
const CHIP = { idle: ['idle', '待机'], run: ['run', '解译中'], done: ['done', '已完成'], fail: ['fail', '失败'] };
function setChip(state) {
  const [cls, text] = CHIP[state] || CHIP.idle;
  el('stateChip').className = 'chip ' + cls;
  el('stateChip').textContent = text;
}

window.addEventListener('pywebviewready', async () => {
  const st = await call('model_status');
  if (st.available) {
    el('modelDot').className = 'dot ok';
    el('modelText').textContent = '检测模型已就绪';
  } else {
    el('modelDot').className = 'dot no';
    el('modelText').textContent = '模型缺失，仅提取车道线';
  }
});

/* ---------- 目录选择 / 打开 ---------- */
async function pickDir(inputId, title) {
  try {
    const r = await call('pick_folder', title);
    if (r && r.ok && r.path) {
      el(inputId).value = r.path;
      return r.path;
    }
    if (r && r.error) toast('无法打开目录选择器：' + r.error, true);
  } catch (e) { toast('无法打开目录选择器：' + e, true); }
  return null;
}
async function openOutDir() {
  const p = el('outDir').value.trim();
  if (!p) { toast('请先选择输出目录', true); return; }
  const r = await call('open_folder', p);
  if (!r.ok) toast(r.error || '打开失败', true);
}
el('browseData').onclick = async () => {
  if (await pickDir('dataDir', '选择数据源目录')) scanDir();
};
el('browseOut').onclick = () => pickDir('outDir', '选择输出目录');
el('openOut').onclick = openOutDir;
el('openOut2').onclick = openOutDir;

/* ---------- 扫描 ---------- */
let lastScan = { dir: '', matched: -1 };
async function scanDir() {
  const d = el('dataDir').value.trim();
  const info = el('scanInfo');
  if (!d) { info.textContent = '请选择数据源目录'; info.className = 'hint'; return; }
  if (lastScan.dir === d && lastScan.matched >= 0) return;   // 已扫过，不重复请求
  info.textContent = '正在扫描数据源…';
  info.className = 'hint';
  const r = await call('scan_directory', d);
  lastScan = { dir: d, matched: r.matched };
  if (r.error) {
    info.textContent = '扫描失败：' + r.error;
    info.className = 'hint err';
    el('runBtn').disabled = true;
    return;
  }
  info.textContent = `影像 ${r.images} · 位姿 ${r.poses} · 可配对 ${r.matched}`;
  info.className = 'hint' + (r.matched > 0 ? ' ok' : '');
  el('runBtn').disabled = r.matched === 0;
  if (r.matched === 0) info.textContent += '，请检查目录结构';
}
el('dataDir').addEventListener('change', () => { lastScan = { dir: '', matched: -1 }; scanDir(); });
el('dataDir').addEventListener('keydown', e => { if (e.key === 'Enter') { lastScan = { dir: '', matched: -1 }; scanDir(); } });

/* ---------- 启动解译 ---------- */
el('runBtn').onclick = async () => {
  const dataDir = el('dataDir').value.trim();
  const outDir = el('outDir').value.trim();
  if (!dataDir || !outDir) { toast('请先选择数据源目录与输出目录', true); return; }
  await scanDir();
  if (lastScan.matched === 0) { toast('数据源中没有可配对的影像', true); return; }

  const r = await call('start_pipeline', dataDir, outDir,
    parseFloat(el('conf').value), parseInt(el('maxImg').value, 10) || null,
    el('fisheye').checked, el('gdb').checked);
  if (!r.started) { toast(r.error || '启动失败', true); return; }

  runStartTs = Date.now();
  setChip('run');
  el('emptyView').style.display = 'none';
  el('runView').style.display = 'block';
  el('resultCard').style.display = 'none';
  el('errBox').style.display = 'none';
  el('runBtn').disabled = true;
  el('runBtn').textContent = '解译中…';
  clearInterval(elapsedTimer);
  elapsedTimer = setInterval(() => { el('mElapsed').textContent = fmtElapsed(Date.now() - runStartTs); }, 500);
  poll();
};

/* ---------- 轮询进度 ---------- */
function poll() {
  const timer = setInterval(async () => {
    let s;
    try { s = await call('get_status'); } catch (e) { return; }
    const pct = s.total ? Math.round(s.progress / s.total * 100) : 0;
    el('pct').innerHTML = pct + '<small>%</small>';
    el('bar').style.width = pct + '%';
    el('mCount').textContent = s.total ? `${s.progress} / ${s.total}` : '—';
    el('mFile').textContent = s.current || '—';
    const log = el('log');
    log.textContent = s.logs.join('\n');
    log.scrollTop = log.scrollHeight;

    if (s.state === 'done' || s.state === 'error') {
      clearInterval(timer);
      clearInterval(elapsedTimer);
      el('mElapsed').textContent = fmtElapsed(Date.now() - runStartTs);
      el('runBtn').disabled = false;
      el('runBtn').textContent = '开始解译';
      if (s.state === 'error') {
        setChip('fail');
        el('errBox').style.display = 'block';
        el('errBox').textContent = s.error || '发生未知错误';
        toast('解译失败', true);
      } else {
        setChip('done');
        toast('解译完成');
        if (s.result) showResult(s.result);
      }
    }
  }, 400);
}

/* ---------- 结果展示 ---------- */
function showResult(r) {
  const card = el('resultCard');
  card.style.display = 'block';
  let html = '<table><tr><th>期次</th><th>目标数</th><th>车道线数</th></tr>';
  for (const [k, v] of Object.entries(r.per_session)) {
    html += `<tr><td>${k}</td><td>${v.det}</td><td>${v.lane}</td></tr>`;
  }
  html += '</table>';
  html += `<div class="hint">时序变化要素 ${r.change_count} 条</div>`;
  if (r.change_path) html += `<div class="hint">${r.change_path}</div>`;
  el('resultBody').innerHTML = html;
}
</script>
</body>
</html>
